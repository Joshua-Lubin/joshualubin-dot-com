name: CI
on:
  pull_request:
    types: [opened, synchronize]
  push:
    branches:
      - main

jobs:
  oxlint:
    name: Oxlint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: oxc-project/oxlint-action@v2.0.1
        with:
          config: .oxlintrc.json
          all-files: false
